[package]
name = "discord-voice"
version = "0.1.0"
edition = "2021"
description = "Prints Discord voice events from the local Discord client's RPC socket"
license = "MIT"
publish = false

[[bin]]
name = "discord-voice"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
