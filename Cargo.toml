[package]
name = "discord-voice"
version = "0.1.2"
edition = "2021"
description = "Shows Discord voice call members in Waybar using the local Discord client's RPC socket"
license = "MIT"
publish = false

[[bin]]
name = "discord-voice"
path = "src/main.rs"

[features]
default = []
# GTK4 layer-shell popup (`discord-voice popup`); needs the gtk4 and
# gtk4-layer-shell system libraries.
popup = ["dep:gtk4", "dep:gtk4-layer-shell"]

[dependencies]
anyhow = "1"
dirs = "6"
gtk4 = { version = "0.11", optional = true }
gtk4-layer-shell = { version = "0.8", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "sync", "time"] }
tiny-skia = "0.12"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
